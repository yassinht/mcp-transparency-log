name: MCP Surface Lock
description: >-
  Fail the build when an MCP server your project depends on changes its tool
  surface. Pins each server's tools in mcp.lock, re-probes them live, and opens
  an issue with the diff when something was edited underneath you.
author: yassinht

branding:
  icon: shield
  color: green

inputs:
  lock:
    description: Path to the lockfile written by `mcpobs lock`.
    required: false
    default: mcp.lock
  open-issue:
    description: >-
      Open (or comment on) a GitHub issue when drift is detected. Needs
      `issues: write` on the job. Set to "false" to only fail the step.
    required: false
    default: "true"
  issue-label:
    description: Label used to find and tag the drift issue.
    required: false
    default: mcp-surface-drift

outputs:
  status:
    description: "0 = all servers match the lock, 1 = at least one changed, 2 = error"
    value: ${{ steps.check.outputs.status }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build mcpobs
      # Built from the action's own checkout, so the binary always matches the
      # tag the workflow pinned -- and `uses: ./` works inside this repository.
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mcpobs" ./cmd/mcpobs

    - name: Check mcp.lock against live servers
      id: check
      shell: bash
      run: |
        set +e
        "$RUNNER_TEMP/mcpobs" --lock "${{ inputs.lock }}" \
          --check-json "$RUNNER_TEMP/mcp-check.json" \
          --check-md   "$RUNNER_TEMP/mcp-check.md" \
          check
        code=$?
        echo "status=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$RUNNER_TEMP/mcp-check.md" ]; then
          cat "$RUNNER_TEMP/mcp-check.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0

    - name: Open or update the drift issue
      if: steps.check.outputs.status == '1' && inputs.open-issue == 'true' && github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.issue-label }}
      run: |
        set -e
        existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body-file "$RUNNER_TEMP/mcp-check.md"
          echo "updated issue #$existing"
        else
          gh label create "$LABEL" --color D93F0B \
            --description "An MCP server pinned in mcp.lock changed its tool surface" 2>/dev/null || true
          gh issue create \
            --title "MCP server tool surface changed (mcp.lock drift)" \
            --label "$LABEL" \
            --body-file "$RUNNER_TEMP/mcp-check.md"
        fi

    - name: Fail on drift
      if: steps.check.outputs.status != '0'
      shell: bash
      run: |
        if [ "${{ steps.check.outputs.status }}" = "1" ]; then
          echo "::error title=mcp.lock drift::An MCP server changed its tool surface since it was locked. See the job summary."
        else
          echo "::error title=mcpobs check failed::Could not complete the check (exit ${{ steps.check.outputs.status }})."
        fi
        exit 1
